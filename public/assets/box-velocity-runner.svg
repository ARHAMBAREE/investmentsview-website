<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="50%" stop-color="#0e0e13" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="40%" stop-color="#c89658" />
      <stop offset="70%" stop-color="#9d6d34" />
      <stop offset="100%" stop-color="#ddb06f" />
    </linearGradient>
    <linearGradient id="bullGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a3" />
      <stop offset="100%" stop-color="#b6823c" />
    </linearGradient>
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Perspective Box Shadow -->
  <ellipse cx="200" cy="450" rx="140" ry="18" fill="rgba(0,0,0,0.6)" filter="url(#glow)"/>

  <!-- Left Spine (3D depth) -->
  <polygon points="65,95 110,75 110,410 65,390" fill="#0b0b0e" stroke="rgba(200,150,88,0.3)" stroke-width="1.5"/>
  <text transform="translate(85,260) rotate(-90)" font-family="sans-serif" font-weight="900" font-size="14" fill="#a4773c" letter-spacing="4">VELOCITY RUNNER EA v4.5</text>

  <!-- Front Face of Box -->
  <polygon points="110,75 330,55 330,375 110,410" fill="url(#boxBg)" stroke="url(#goldEdge)" stroke-width="2.5"/>

  <!-- Subtle grid lines on front -->
  <g opacity="0.12" stroke="#22c55e" stroke-width="1">
    <line x1="110" y1="120" x2="330" y2="100" />
    <line x1="110" y1="170" x2="330" y2="150" />
    <line x1="110" y1="220" x2="330" y2="200" />
    <line x1="110" y1="270" x2="330" y2="250" />
    <line x1="110" y1="320" x2="330" y2="300" />
    <line x1="154" y1="70" x2="154" y2="400" />
    <line x1="220" y1="65" x2="220" y2="390" />
    <line x1="286" y1="60" x2="286" y2="380" />
  </g>

  <!-- Front Face Inner Glow -->
  <polygon points="118,85 322,67 322,367 118,398" fill="none" stroke="rgba(200,150,88,0.25)" stroke-width="1"/>

  <!-- Top Logo / Badge -->
  <g transform="translate(145, 95)">
    <rect x="0" y="0" width="145" height="24" rx="4" fill="rgba(200,150,88,0.15)" stroke="#c89658" stroke-width="1"/>
    <text x="72" y="16" font-family="sans-serif" font-weight="800" font-size="10" fill="#f5d485" text-anchor="middle" letter-spacing="1.5">INVESTMENTSVIEW.DE</text>
  </g>

  <!-- Shield & Bull Emblem in Gold -->
  <g transform="translate(220, 205)">
    <!-- Golden Shield Outer -->
    <path d="M0 -55 L42 -35 L42 15 C42 42 0 62 0 62 C0 62 -42 42 -42 15 L-42 -35 Z" fill="rgba(10,10,12,0.9)" stroke="url(#goldEdge)" stroke-width="3"/>
    <!-- Bull silhouette / Fast Horns -->
    <path d="M-22 -15 Q-32 -32 -16 -34 Q-8 -26 0 -18 Q8 -26 16 -34 Q32 -32 22 -15 Q14 2 0 16 Q-14 2 -22 -15 Z" fill="url(#bullGold)"/>
    <circle cx="-8" cy="-10" r="2.5" fill="#18181f"/>
    <circle cx="8" cy="-10" r="2.5" fill="#18181f"/>
    <!-- Center Green Trading Candlestick in Shield -->
    <rect x="-3" y="-5" width="6" height="20" rx="1.5" fill="#22c55e" filter="url(#glow)"/>
    <line x1="0" y1="-12" x2="0" y2="22" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Title Text -->
  <text x="220" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">VELOCITY</text>
  <text x="220" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="url(#goldEdge)" text-anchor="middle" letter-spacing="3">PROFIT RUNNER</text>
  <text x="220" y="336" font-family="sans-serif" font-weight="700" font-size="11" fill="#22c55e" text-anchor="middle" letter-spacing="2">EA v4.5 • MT4 / MT5</text>

  <!-- Bottom Badges on Box -->
  <g transform="translate(125, 350)">
    <!-- 3 Mini badges -->
    <rect x="0" y="0" width="55" height="20" rx="3" fill="#18181f" stroke="#333" stroke-width="1"/>
    <text x="27" y="13" font-family="sans-serif" font-weight="700" font-size="8" fill="#c89658" text-anchor="middle">XAUUSD</text>

    <rect x="65" y="-3" width="60" height="20" rx="3" fill="#18181f" stroke="#333" stroke-width="1"/>
    <text x="95" y="10" font-family="sans-serif" font-weight="700" font-size="8" fill="#22c55e" text-anchor="middle">PROP FIRM</text>

    <rect x="135" y="-6" width="55" height="20" rx="3" fill="#18181f" stroke="#333" stroke-width="1"/>
    <text x="162" y="7" font-family="sans-serif" font-weight="700" font-size="8" fill="#f5d485" text-anchor="middle">SMART GRID</text>
  </g>

  <!-- Top Face of 3D Box -->
  <polygon points="65,95 285,75 330,55 110,75" fill="#252530" stroke="rgba(200,150,88,0.4)" stroke-width="1"/>
</svg>
